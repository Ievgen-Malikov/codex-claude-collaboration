[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-claude-collaboration"
version = "0.1.0"
description = "A file-based protocol for time-bounded review between independent coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["codex", "claude-code", "agent-collaboration", "peer-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Repository = "https://github.com/Ievgen-Malikov/codex-claude-collaboration"
Issues = "https://github.com/Ievgen-Malikov/codex-claude-collaboration/issues"

[project.scripts]
agent-review-session = "review_session.cli:main"

[tool.setuptools.packages.find]
include = ["review_session*"]
